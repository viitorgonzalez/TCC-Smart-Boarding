# Configuracao de desenvolvimento COMPARTILHADA (versionada).
#
# Separada de `application-local.properties`, que e gitignored e existe pra
# override pessoal por maquina. O que precisa valer pra todo mundo que roda o
# projeto mora aqui.
#
# Ativado pelo `run-local.sh`. Producao nunca ativa este perfil.

# Dado de demonstracao: contas de todos os papeis e conteudo pras telas nao
# nascerem vazias. As senhas estao publicadas no proprio arquivo do seed, entao
# ele so entra por aqui -- a base carrega apenas o schema, pra que esquecer
# configuracao no deploy nao vire administrador de credencial conhecida.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
