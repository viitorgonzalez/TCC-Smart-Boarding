spring.application.name=smartboarding-api

# Perfil ativo. Local por padrao; em producao passe SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Banco ─────────────────────────────────────────────────────────────────────
# Host/porta externalizados: o compose local expoe o Postgres na 5433 (pra nao
# brigar com um Postgres ja instalado), mas um banco gerenciado usa outro
# endereco. Em provedor que entrega a URL pronta, sobrescreva tudo de uma vez
# com SPRING_DATASOURCE_URL — o Spring da precedencia a ela.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# SQL no console: util em desenvolvimento, desligado no perfil prod.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicito pra silenciar o warning do Spring. Mantem o comportamento ATUAL
# (a sessao fica aberta durante o render da resposta). Desligar e o certo, mas
# quebra qualquer lazy loading que hoje dependa disso — precisa de teste de
# integracao antes, e a cobertura atual nao pega isso.
spring.jpa.open-in-view=true

# Override pessoal por maquina: crie application-local.properties (gitignored).

# ── Seguranca ─────────────────────────────────────────────────────────────────
# Minimo 32 bytes — segredo curto falha no boot, nao na primeira request.
api.security.token.secret=${JWT_SECRET}

# ── Firebase (FCM) ────────────────────────────────────────────────────────────
# Vazio desabilita as notificacoes; a aplicacao sobe do mesmo jeito.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# ── Servidor ──────────────────────────────────────────────────────────────────
# PORT porque quase todo provedor (Render, Railway, Fly, Heroku) injeta a porta.
server.port=${PORT:8080}
server.shutdown=graceful
