name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR novo cancela a run anterior da mesma branch — economiza minuto de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 21 · Spring Boot)
    runs-on: ubuntu-latest

    # mvn verify sobe seu próprio Postgres via Testcontainers (docker já vem pronto no
    # runner) — não precisa mais subir Postgres manualmente aqui. Ver
    # SmartboardingApiApplicationIT.

    defaults:
      run:
        working-directory: smartboarding-api

    steps:
      # fetch-depth: 0 -- o gate de tamanho de arquivo (abaixo) precisa do commit
      # base da PR disponível localmente pra calcular o diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testes (unit + integration)
        # Failsafe (*IT.java) sobe Postgres via Testcontainers; Surefire (*Test.java)
        # não precisa de infra nenhuma. Um verify só roda os dois.
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress verify

      # O `verify` acima ja reprova sozinho: o jacoco:check trava em 90% na regra
      # de negocio (application.*) e 70% no resto. Este passo so publica o numero
      # no resumo da run.
      - name: Cobertura (resumo)
        if: always()
        working-directory: .
        run: |
          csv="smartboarding-api/target/site/jacoco/jacoco.csv"
          if [ -f "$csv" ]; then
            awk -F',' 'NR>1{missed+=$8; covered+=$9} END{
              if (covered+missed>0) printf "**Cobertura de linhas (unit, API):** %.1f%%\n", 100*covered/(covered+missed);
              else print "**Cobertura de linhas (unit, API):** sem dados"
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Cobertura de linhas (unit, API):** relatório não encontrado" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reforma 2026-08-14: limite duro de 300 linhas por arquivo de produção,
      # só nos arquivos TOCADOS pela PR — não é sweep completo do repo, porque
      # débito pré-existente não deveria travar todo PR futuro (mesmo raciocínio
      # do ratchet de cobertura acima: não piorar, não exigir perfeição retroativa).
      - name: Quality gate de tamanho de arquivo
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'smartboarding-api/src/main/**/*.java')
          violations=""
          for f in $changed; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 300 ]; then
              violations="$violations
          $f: $lines linhas"
            fi
          done
          if [ -n "$violations" ]; then
            echo "Arquivos no diff acima de 300 linhas:$violations"
            exit 1
          fi
          echo "Quality gate de tamanho de arquivo: OK"

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smartboarding_app

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Testes
        run: flutter test --coverage

      - name: Gate de cobertura
        run: ./scripts/coverage-gate.sh

      - name: Cobertura (resumo)
        if: always()
        working-directory: .
        run: |
          lcov="smartboarding_app/coverage/lcov.info"
          if [ -f "$lcov" ]; then
            awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{
              if (lf>0) printf "**Cobertura de linhas (unit, App):** %.1f%%\n", 100*lh/lf;
              else print "**Cobertura de linhas (unit, App):** sem dados"
            }' "$lcov" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Cobertura de linhas (unit, App):** relatório não encontrado" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Mesmo gate do job `api`, só nos arquivos .dart de produção (lib/) tocados
      # pela PR — student_home_screen.dart (497 linhas) e user_management_screen.dart
      # (387 linhas) já excedem 300 hoje; só falham se aparecerem no diff.
      - name: Quality gate de tamanho de arquivo
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'smartboarding_app/lib/**/*.dart')
          violations=""
          for f in $changed; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 300 ]; then
              violations="$violations
          $f: $lines linhas"
            fi
          done
          if [ -n "$violations" ]; then
            echo "Arquivos no diff acima de 300 linhas:$violations"
            exit 1
          fi
          echo "Quality gate de tamanho de arquivo: OK"
