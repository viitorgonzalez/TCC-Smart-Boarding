name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR novo cancela a run anterior da mesma branch — economiza minuto de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 21 · Spring Boot)
    runs-on: ubuntu-latest

    # O SmartboardingApiApplicationTests é @SpringBootTest sem config de teste:
    # sobe o contexto inteiro, então precisa de Postgres de verdade. A porta é
    # 5433 porque application.properties tem o :5433 hardcoded na datasource URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartboarding_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U admin -d smartboarding_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: smartboarding-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testes
        # Flyway aplica V1..V11 no boot do contexto — o job também valida
        # que as migrations sobem de um banco vazio.
        env:
          DB_NAME: smartboarding_db
          DB_USER: admin
          DB_PASSWORD: ci_password
          JWT_SECRET: ci_secret_com_no_minimo_32_caracteres_ok
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress test

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smartboarding_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      # NÃO-BLOQUEANTE por ora: 24 dos 47 arquivos estão fora do `dart format`
      # hoje (verificado em 2026-08-12). Deixar bloqueante reprovaria o primeiro
      # PR por motivo cosmético. Pra tornar obrigatório: rode `dart format .`,
      # commite o reformat isolado, e remova o continue-on-error daqui.
      - name: Formatação (aviso)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Testes
        run: flutter test
