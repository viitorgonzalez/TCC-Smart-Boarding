# Perfil de producao. Ative com SPRING_PROFILES_ACTIVE=prod.

# Nada de SQL no log: vaza dado em log agregado e custa performance.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate nunca mexe no schema — quem manda e o Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Flyway roda no boot. `validate-on-migrate` garante que um arquivo de migration
# alterado depois de aplicado derrube o boot em vez de divergir em silencio.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Pool: o default do Hikari (10) costuma passar do limite de conexao dos planos
# gratuitos de Postgres gerenciado. Ajuste por env sem rebuildar.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.connection-timeout=30000

# Nao exponha stacktrace nem mensagem interna na resposta de erro.
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.root=INFO
logging.level.com.smartboarding=INFO
