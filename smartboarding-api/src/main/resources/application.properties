spring.application.name=smartboarding-api

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Host/porta externalizados: o compose local expoe o Postgres na 5433 (pra nao
# brigar com um Postgres ja instalado), mas um banco gerenciado usa outro
# endereco. Em provedor que entrega a URL pronta, sobrescreva tudo de uma vez
# com SPRING_DATASOURCE_URL — o Spring da precedencia a ela.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicito pra silenciar o warning do Spring. Mantem o comportamento ATUAL
# (a sessao fica aberta durante o render da resposta). Desligar e o certo, mas
# quebra qualquer lazy loading que hoje dependa disso — precisa de teste de
# integracao antes, e a cobertura atual nao pega isso.
spring.jpa.open-in-view=true

# Override pessoal por maquina: crie application-local.properties (gitignored).

# Minimo 32 bytes — segredo curto falha no boot, nao na primeira request.
api.security.token.secret=${JWT_SECRET}

# Vazio desabilita as notificacoes; a aplicacao sobe do mesmo jeito.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:}

# Defaults nao-em-branco: o SDK da AWS valida credencial na CONSTRUCAO do client
# (nao so na chamada real), entao sem R2 configurado a app precisa de um valor
# nao-vazio so pra dar boot -- upload real falha (403) sem credencial de verdade,
# mas isso so acontece quando StoragePort for de fato chamado (Fase 4).
r2.account.id=${R2_ACCOUNT_ID:unconfigured}
r2.access.key.id=${R2_ACCESS_KEY_ID:unconfigured}
r2.secret.access.key=${R2_SECRET_ACCESS_KEY:unconfigured}
r2.bucket.name=${R2_BUCKET_NAME:unconfigured}
r2.public.base.url=${R2_PUBLIC_BASE_URL:unconfigured}

# PORT porque quase todo provedor (Render, Railway, Fly, Heroku) injeta a porta.
server.port=${PORT:8080}
server.shutdown=graceful

# Fuso das regras de horário da lista (fechamento por rota).
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# Recuperacao de senha (RN22). Validade curta e limite de tentativas sao a defesa
# do codigo de 6 digitos, que tem pouca entropia por natureza.
app.password-reset.code-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:15}
app.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}
app.password-reset.resend-cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}

# Codigo de convite da rota. O comprimento fica configuravel porque e o unico
# botao pra aumentar o espaco de busca se um dia o codigo virar alvo.
app.route-invite.code-length=${ROUTE_INVITE_CODE_LENGTH:6}
app.route-invite.default-validity-days=${ROUTE_INVITE_VALIDITY_DAYS:90}

# Entrar com Google. O client ID sai do console do Google Cloud; vazio desliga
# o login social e o endpoint passa a recusar com mensagem clara, em vez de
# aceitar token de qualquer origem.
google.client-id=${GOOGLE_CLIENT_ID:}
