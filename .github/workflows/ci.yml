name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR novo cancela a run anterior da mesma branch — economiza minuto de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 21 · Spring Boot)
    runs-on: ubuntu-latest

    # O SmartboardingApiApplicationTests é @SpringBootTest sem config de teste:
    # sobe o contexto inteiro, então precisa de Postgres de verdade.
    #
    # O Postgres sobe num STEP, não no bloco `services:`. Motivo: `services`
    # é instanciado antes de qualquer step rodar, então só aceita valor
    # literal ou ${{ secrets }} — o que obrigaria a cravar credencial no
    # arquivo. Subindo em step, as credenciais são geradas na hora e nada
    # sensível fica versionado.
    #
    # A porta é 5433 porque application.properties tem o :5433 na datasource URL.

    defaults:
      run:
        working-directory: smartboarding-api

    steps:
      # fetch-depth: 0 -- o gate de tamanho de arquivo (abaixo) precisa do commit
      # base da PR disponível localmente pra calcular o diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Nada de credencial fixa no repo: valor de alta entropia commitado
      # dispara scanner de segredo (GitGuardian) mesmo sendo descartável, e
      # alerta que é ruído treina todo mundo a ignorar alerta de verdade.
      # O banco é efêmero e morre com o runner; o Spring só exige que o
      # JWT_SECRET tenha >= 32 bytes pra assinar o token.
      - name: Gera credenciais efêmeras
        working-directory: .
        run: |
          {
            echo "DB_NAME=smartboarding_ci"
            echo "DB_USER=ci_$(openssl rand -hex 6)"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Sobe Postgres 16
        working-directory: .
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB="$DB_NAME" \
            -e POSTGRES_USER="$DB_USER" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -p 5433:5432 \
            postgres:16
          # Espera o banco aceitar conexão antes de deixar o Spring tentar.
          for _ in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null 2>&1; then
              echo "Postgres pronto"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres não ficou pronto em 60s" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Testes
        # Flyway aplica V1 e V2 no boot do contexto — o job também valida
        # que as migrations sobem de um banco vazio.
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress test

      # Reforma 2026-08-14: limite duro de 300 linhas por arquivo de produção,
      # só nos arquivos TOCADOS pela PR — não é sweep completo do repo, porque
      # débito pré-existente não deveria travar todo PR futuro (mesmo raciocínio
      # do ratchet de cobertura acima: não piorar, não exigir perfeição retroativa).
      - name: Quality gate de tamanho de arquivo
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'smartboarding-api/src/main/**/*.java')
          violations=""
          for f in $changed; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 300 ]; then
              violations="$violations
          $f: $lines linhas"
            fi
          done
          if [ -n "$violations" ]; then
            echo "Arquivos no diff acima de 300 linhas:$violations"
            exit 1
          fi
          echo "Quality gate de tamanho de arquivo: OK"

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smartboarding_app

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Testes
        run: flutter test

      # Mesmo gate do job `api`, só nos arquivos .dart de produção (lib/) tocados
      # pela PR — student_home_screen.dart (497 linhas) e user_management_screen.dart
      # (387 linhas) já excedem 300 hoje; só falham se aparecerem no diff.
      - name: Quality gate de tamanho de arquivo
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'smartboarding_app/lib/**/*.dart')
          violations=""
          for f in $changed; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 300 ]; then
              violations="$violations
          $f: $lines linhas"
            fi
          done
          if [ -n "$violations" ]; then
            echo "Arquivos no diff acima de 300 linhas:$violations"
            exit 1
          fi
          echo "Quality gate de tamanho de arquivo: OK"
