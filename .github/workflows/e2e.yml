name: e2e

# Só manual. O agendamento noturno foi removido: o job nunca ficou verde (12/12
# falhas desde 29/08, sempre no passo do emulador) e o vermelho diário virava
# ruído que escondia falha de verdade. O teste continua aqui porque é válido --
# o que não presta é o emulador no runner. Rode com:
#   gh workflow run e2e.yml
#
# ⚠️ AINDA NÃO PASSA, e agora por um motivo a mais: o teste loga com uma conta do
# seed, cujos hashes Argon2id só batem com o PASSWORD_PEPPER que os gerou. Aqui o
# pepper é gerado por execução (não versionamos segredo), então o login do seed
# falha. Resolver exige escolher um caminho:
#   (a) um pepper de dev fixo e documentado, com os hashes do seed regerados; ou
#   (b) o workflow montar o ambiente todo pela API (admin, rota, parada, código,
#       aluno) -- o BOOTSTRAP_ADMIN_EMAIL não serve junto do seed, porque ele só
#       promove quando não existe nenhum admin.
on:
  workflow_dispatch:

jobs:
  app-e2e:
    name: E2E (Android · login + lista)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Postgres aqui é manual (o e2e roda o jar da API de verdade, não Testcontainers) — credencial gerada em runtime pra não versionar nada.
      - name: Gera credenciais efêmeras
        run: |
          {
            echo "DB_NAME=smartboarding_e2e"
            echo "DB_USER=e2e_$(openssl rand -hex 6)"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PASSWORD_PEPPER=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Sobe Postgres 16
        run: |
          docker run -d --name e2e-postgres \
            -e POSTGRES_DB="$DB_NAME" \
            -e POSTGRES_USER="$DB_USER" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -p 5433:5432 \
            postgres:16
          for _ in $(seq 1 30); do
            if docker exec e2e-postgres pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null 2>&1; then
              echo "Postgres pronto"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres não ficou pronto em 60s" >&2
          docker logs e2e-postgres >&2
          exit 1

      - name: Builda e sobe a API em background
        working-directory: smartboarding-api
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package
          nohup java -jar target/*.jar \
            --spring.profiles.active=local,dev \
            > ../api.log 2>&1 &
          # /api/routes exige token desde a correcao do IDOR. Sem Actuator no
          # pom, o sinal de "subiu" passa a ser o proprio login respondendo —
          # 401 serve: significa que a aplicacao esta atendendo e decidindo.
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                  http://localhost:8080/api/auth/login \
                  -H 'Content-Type: application/json' -d '{}')" != "000" ]; then
              echo "API pronta"
              exit 0
            fi
            sleep 2
          done
          echo "API não respondeu em 60s" >&2
          cat ../api.log >&2
          exit 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        working-directory: smartboarding_app
        run: flutter pub get

      - name: Habilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: E2E no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          working-directory: smartboarding_app
          script: |
            flutter test integration_test/ --dart-define=API_BASE_URL=http://10.0.2.2:8080
